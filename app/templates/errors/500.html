{% extends "base.html" %}

{% block title %}Error interno — SGTA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="py-5">
            <h1 class="display-1 text-danger fw-bold">500</h1>
            <div class="mb-4">
                <i class="bi bi-bug display-3 text-danger"></i>
            </div>
            <h3 class="mb-3">Error interno del servidor</h3>
            <p class="text-muted mb-4">
                Ocurrió un error inesperado. El equipo técnico ha sido notificado.
                Intenta nuevamente más tarde.
            </p>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
