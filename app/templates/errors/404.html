{% extends "base.html" %}

{% block title %}Página no encontrada — SGTA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="py-5">
            <h1 class="display-1 text-warning fw-bold">404</h1>
            <div class="mb-4">
                <i class="bi bi-emoji-frown display-3 text-warning"></i>
            </div>
            <h3 class="mb-3">Página no encontrada</h3>
            <p class="text-muted mb-4">
                La página que buscas no existe o ha sido movida.
                Verifica la dirección o vuelve al inicio.
            </p>
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
